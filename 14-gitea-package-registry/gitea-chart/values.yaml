replicaCount: 1

image:
  repository: docker.gitea.com/gitea
  tag: 1.26.4-rootless
  pullPolicy: IfNotPresent

service:
  port: 3000

persistence:
  size: 20Gi
  storageClassName: standard

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

gateway:
  name: native-gateway
  namespace: default
  hostname: gitea.kind.local

runtimeSecret: gitea-runtime-credentials
caSecret: gitea-kind-local-ca
