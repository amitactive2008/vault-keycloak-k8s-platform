# Creates the team-a namespace and binds the Keycloak 'team-a' group to admin
# within that namespace only.  team-a users have NO access to other namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    team: team-a
    app.kubernetes.io/managed-by: keycloak-k8s-oidc
---
# Full admin within team-a namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-team-a-admin
  namespace: team-a
  labels:
    app.kubernetes.io/managed-by: keycloak-k8s-oidc
subjects:
  - kind: Group
    name: team-a                          # matches JWT groups claim value
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin                             # built-in: full CRUD in namespace
  apiGroup: rbac.authorization.k8s.io
---
# Allow team-a to list/get their own namespace (so kubectl get ns works)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keycloak-team-a-ns-viewer
  labels:
    app.kubernetes.io/managed-by: keycloak-k8s-oidc
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
    resourceNames: ["team-a"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-team-a-ns-viewer
  labels:
    app.kubernetes.io/managed-by: keycloak-k8s-oidc
subjects:
  - kind: Group
    name: team-a
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: keycloak-team-a-ns-viewer
  apiGroup: rbac.authorization.k8s.io
