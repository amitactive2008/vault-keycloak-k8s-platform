## ============================================================
## Ingress for Keycloak UI
## Hostname: keycloak.local  →  https://keycloak.local
## HTTP (port 80) redirects to HTTPS (port 443).
##
## /etc/hosts entry required:  127.0.0.1  keycloak.local
## TLS secret: keycloak-local-tls  (created by k8s-oidc/setup.sh)
## ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    # Required for Keycloak's large cookie / OIDC token headers
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Increase body size limit for Keycloak admin API calls
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Redirect HTTP → HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: keycloak-local-tls
      hosts:
        - keycloak.local
  rules:
    - host: keycloak.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
