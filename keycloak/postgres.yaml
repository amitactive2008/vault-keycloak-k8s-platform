## ============================================================
## PostgreSQL for Keycloak
## Image: docker.io/library/postgres:17  (official Docker Hub image)
## ============================================================

# ── Secret ────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-postgresql-secret
  namespace: keycloak
  labels:
    app: keycloak-postgresql
type: Opaque
stringData:
  username: keycloak
  password: "Keycloak@2024!"  # DEMO ONLY — change for any non-local deployment
  database: keycloak
---
# ── Headless service (StatefulSet DNS) ───────────────────────
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql-headless
  namespace: keycloak
  labels:
    app: keycloak-postgresql
spec:
  clusterIP: None
  selector:
    app: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
# ── ClusterIP service (used by Keycloak) ─────────────────────
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: keycloak
  labels:
    app: keycloak-postgresql
spec:
  type: ClusterIP
  selector:
    app: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
---
# ── StatefulSet ───────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  namespace: keycloak
  labels:
    app: keycloak-postgresql
spec:
  serviceName: keycloak-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-postgresql
  template:
    metadata:
      labels:
        app: keycloak-postgresql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: docker.io/library/postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgresql-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgresql-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgresql-secret
                  key: password
            # Store data in a sub-directory to avoid "lost+found" directory issue
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - keycloak
                - -d
                - keycloak
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
