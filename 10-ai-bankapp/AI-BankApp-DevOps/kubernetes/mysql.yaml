apiVersion: v1
kind: Service
metadata:
  name: ai-bankapp-mysql
  namespace: team-b
  labels:
    app.kubernetes.io/name: ai-bankapp-mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: ai-bankapp-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-bankapp-mysql
  namespace: team-b
spec:
  serviceName: ai-bankapp-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-bankapp-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-bankapp-mysql
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "team-b-ai-bankapp"
        vault.hashicorp.com/agent-inject-secret-mysql.env: "secret/data/team-b/ai-bankapp"
        vault.hashicorp.com/agent-inject-template-mysql.env: |
          {{- with secret "secret/data/team-b/ai-bankapp" -}}
          export MYSQL_ROOT_PASSWORD="{{ .Data.data.DB_ROOT_PASSWORD }}"
          export MYSQL_DATABASE="{{ .Data.data.DB_NAME }}"
          export MYSQL_USER="{{ .Data.data.DB_USER }}"
          export MYSQL_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          {{- end }}
    spec:
      serviceAccountName: ai-bankapp
      securityContext:
        fsGroup: 1000
      containers:
        - name: mysql
          image: mysql:8.0
          command: ["/bin/bash", "-c"]
          args:
            - source /vault/secrets/mysql.env && exec docker-entrypoint.sh mysqld
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
