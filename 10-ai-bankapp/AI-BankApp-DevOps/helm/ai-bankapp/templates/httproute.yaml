{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ai-bankapp.fullname" . }}
  labels:
    {{- include "ai-bankapp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parent.name }}
      namespace: {{ .Values.gateway.parent.namespace }}
      sectionName: {{ .Values.gateway.parent.httpsSectionName }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "ai-bankapp.fullname" . }}
          port: {{ .Values.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ai-bankapp.fullname" . }}-http-redirect
  labels:
    {{- include "ai-bankapp.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parent.name }}
      namespace: {{ .Values.gateway.parent.namespace }}
      sectionName: {{ .Values.gateway.parent.httpSectionName }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
