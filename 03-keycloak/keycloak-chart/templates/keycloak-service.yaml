apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ include "keycloak.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
  ports:
    # Main HTTP port — nginx ingress proxies to this
    - name: http
      port: 80
      targetPort: 8080
    # Management port — health / metrics endpoints (not exposed externally)
    - name: management
      port: 9000
      targetPort: 9000
