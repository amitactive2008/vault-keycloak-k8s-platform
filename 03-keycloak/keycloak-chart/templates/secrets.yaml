# ── Keycloak admin bootstrap credentials ─────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: {{ include "keycloak.namespace" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.keycloak.auth.adminUsername | quote }}
  admin-password: {{ .Values.keycloak.auth.adminPassword | quote }}
---
# ── PostgreSQL credentials ────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-postgresql-secret
  namespace: {{ include "keycloak.namespace" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}
