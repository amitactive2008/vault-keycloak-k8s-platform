# HTTPRoute for keycloak.kind.local
# Routes HTTPS traffic from the shared Envoy Gateway (default namespace)
# to the keycloak service on port 80 (→ 8080 in the pod).
# TLS is terminated at the gateway using the wildcard *.kind.local cert.
# Keycloak itself listens on plain HTTP (KC_HTTP_ENABLED=true, KC_PROXY_HEADERS=xforwarded).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "keycloak.kind.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: keycloak
      port: 80
---
# HTTP -> HTTPS redirect for keycloak.kind.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-http-redirect
  namespace: keycloak
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: http
  hostnames:
  - "keycloak.kind.local"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
