apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-bankapp.fullname" . }}
  labels:
    {{- include "ai-bankapp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ai-bankapp.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-bankapp.fullname" . }}
  labels:
    {{- include "ai-bankapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-bankapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-bankapp.selectorLabels" . | nindent 8 }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-application.env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-application.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          export MYSQL_HOST="{{ include "ai-bankapp.fullname" . }}-mysql"
          export MYSQL_PORT="3306"
          export MYSQL_DATABASE="{{`{{ .Data.data.DB_NAME }}`}}"
          export MYSQL_USER="{{`{{ .Data.data.DB_USER }}`}}"
          export MYSQL_PASSWORD="{{`{{ .Data.data.DB_PASSWORD }}`}}"
          export OLLAMA_URL="http://{{ include "ai-bankapp.fullname" . }}-ollama:11434"
          {{`{{- end }}`}}
    spec:
      serviceAccountName: {{ include "ai-bankapp.serviceAccountName" . }}
      securityContext:
        fsGroup: 1000
      containers:
        - name: bankapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/application.env && exec java -jar app.jar
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
