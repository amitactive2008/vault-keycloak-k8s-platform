apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-bankapp.fullname" . }}-ollama
  labels:
    {{- include "ai-bankapp.componentLabels" (dict "root" . "component" "ollama") | nindent 4 }}
spec:
  selector:
    {{- include "ai-bankapp.componentSelectorLabels" (dict "root" . "component" "ollama") | nindent 4 }}
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ai-bankapp.fullname" . }}-ollama
  labels:
    {{- include "ai-bankapp.componentLabels" (dict "root" . "component" "ollama") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-bankapp.fullname" . }}-ollama
  labels:
    {{- include "ai-bankapp.componentLabels" (dict "root" . "component" "ollama") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ai-bankapp.componentSelectorLabels" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-bankapp.componentSelectorLabels" (dict "root" . "component" "ollama") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "ai-bankapp.fullname" . }}-ollama
        - name: tmp
          emptyDir: {}
