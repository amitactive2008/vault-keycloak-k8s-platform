# PostgreSQL for team-a webapp
#
# The K8s Secret here bootstraps the initial DB user/password so PostgreSQL
# starts up correctly.  The *application* (backend) does NOT read this Secret —
# it gets credentials from Vault Agent at /vault/secrets/db.env.
# Both sources must use the same username/password.
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-init
  namespace: team-a
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: webapp_user
  POSTGRES_PASSWORD: "S3cur3P@ssw0rd"   # DEMO ONLY — must match vault-setup.sh Step 1
  POSTGRES_DB: webapp_db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: team-a
  labels:
    app: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-init
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-init
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-init
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "webapp_user", "-d", "webapp_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Headless service — DNS: postgres.team-a.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: team-a
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
