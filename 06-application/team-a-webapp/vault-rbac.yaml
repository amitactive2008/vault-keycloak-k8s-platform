# Grant the Vault service account the RBAC permissions required by the
# Kubernetes secrets engine to generate short-lived service account tokens.
#
# The Kubernetes secrets engine (vault write kubernetes/creds/<role>) calls
# the TokenRequest API on behalf of the target service account.  The vault SA
# must have permission to:
#   • create  serviceaccounts/token   (TokenRequest)
#   • get     serviceaccounts / namespaces (validation)
#   • get     roles, clusterroles, rolebindings, clusterrolebindings
#             (used when generating role-based tokens)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-k8s-secrets-engine
  labels:
    app.kubernetes.io/managed-by: vault-setup
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "namespaces"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-k8s-secrets-engine
  labels:
    app.kubernetes.io/managed-by: vault-setup
subjects:
  - kind: ServiceAccount
    name: vault          # the SA created by the Vault Helm chart
    namespace: vault
roleRef:
  kind: ClusterRole
  name: vault-k8s-secrets-engine
  apiGroup: rbac.authorization.k8s.io
