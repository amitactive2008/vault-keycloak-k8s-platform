# Ingress for team-a webapp
#
# All external traffic enters at http://team-a-webapp.local/
# nginx proxies /api/* to the backend; everything else hits the frontend.
# The frontend's nginx.conf also reverse-proxies /api/ internally, so
# cross-origin issues never arise.
#
# Add a local DNS entry (one-time):
#   echo "127.0.0.1 team-a-webapp.local" | sudo tee -a /etc/hosts
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-a-webapp
  namespace: team-a
  labels:
    app: team-a-webapp
  annotations:
    # Route /api/* directly to the backend (strips the /api prefix)
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: team-a-webapp.local
      http:
        paths:
          # Backend API — served directly by ingress (no hop through frontend)
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: webapp-backend
                port:
                  number: 5000
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp-frontend
                port:
                  number: 80
