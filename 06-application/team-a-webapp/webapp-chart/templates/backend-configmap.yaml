apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-script
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-backend
    {{- include "webapp.labels" . | nindent 4 }}
data:
  server.py: |
    #!/usr/bin/env python3
    """
    Minimal backend API server.
    Reads Vault-injected DB credentials from /vault/secrets/db.env
    and exposes them (password masked) via a JSON API.
    """
    import json
    import os
    import signal
    import socket
    from http.server import HTTPServer, BaseHTTPRequestHandler

    VAULT_SECRET_FILE = "/vault/secrets/db.env"

    def _handle_sighup(signum, frame):
        print("SIGHUP received — Vault Agent refreshed /vault/secrets/db.env",
              flush=True)

    signal.signal(signal.SIGHUP, _handle_sighup)

    def load_db_creds():
        creds = {}
        try:
            with open(VAULT_SECRET_FILE) as f:
                for line in f:
                    line = line.strip()
                    if line.startswith("export "):
                        line = line[len("export "):]
                    if "=" in line:
                        k, v = line.split("=", 1)
                        creds[k.strip()] = v.strip().strip('"').strip("'")
        except FileNotFoundError:
            creds["error"] = "Vault secret not yet injected (/vault/secrets/db.env missing)"
        except Exception as exc:
            creds["error"] = str(exc)
        return creds

    def check_db_connectivity(creds):
        host = creds.get("DB_HOST", "")
        port = int(creds.get("DB_PORT", 5432))
        try:
            with socket.create_connection((host, port), timeout=2):
                return True, f"TCP connection to {host}:{port} succeeded"
        except Exception as exc:
            return False, str(exc)

    class Handler(BaseHTTPRequestHandler):
        def _respond(self, code, body):
            payload = json.dumps(body, indent=2).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Access-Control-Allow-Origin", "*")
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/api/health":
                self._respond(200, {"status": "ok", "pod": os.environ.get("HOSTNAME", "unknown")})
            elif self.path == "/api/db-creds":
                creds = load_db_creds()
                display = dict(creds)
                if "DB_PASSWORD" in display:
                    display["DB_PASSWORD"] = "***REDACTED***"
                self._respond(200, {
                    "vault_injected": "error" not in creds,
                    "secret_file": VAULT_SECRET_FILE,
                    "creds": display
                })
            elif self.path == "/api/db-status":
                creds = load_db_creds()
                if "error" in creds:
                    self._respond(200, {"connected": False, "message": creds["error"]})
                else:
                    ok, msg = check_db_connectivity(creds)
                    self._respond(200, {"connected": ok, "message": msg,
                                        "host": creds.get("DB_HOST"),
                                        "port": creds.get("DB_PORT")})
            else:
                self._respond(404, {"error": "not found"})

        def log_message(self, fmt, *args):
            pass

    if __name__ == "__main__":
        port = int(os.environ.get("PORT", 5000))
        print(f"Backend listening on :{port}")
        HTTPServer(("0.0.0.0", port), Handler).serve_forever()
