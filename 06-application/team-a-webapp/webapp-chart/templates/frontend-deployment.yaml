---
# ── Frontend Deployment ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-frontend
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-frontend
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: webapp-frontend
  template:
    metadata:
      labels:
        app: webapp-frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "webapp.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
# ── Frontend Service ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: webapp-frontend
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-frontend
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  selector:
    app: webapp-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
