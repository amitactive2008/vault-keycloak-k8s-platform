# PostgreSQL bootstrap secret.
# Used by the StatefulSet to create the initial database user/password.
# The APPLICATION (backend pod) does NOT read this Secret — it gets credentials
# from Vault Agent at /vault/secrets/db.env.
# Both sources must use the same username/password.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-init
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: postgres
    {{- include "webapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
