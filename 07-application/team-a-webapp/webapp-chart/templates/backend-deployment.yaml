---
# ── Backend Deployment ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-backend
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-backend
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: webapp-backend
  template:
    metadata:
      labels:
        app: webapp-backend
      annotations:
        # ── Vault Agent sidecar injection ────────────────────────────────
        # The Vault Agent injector intercepts this pod and:
        #   1. Authenticates to Vault using the webapp-backend SA token
        #   2. Renders the template into /vault/secrets/db.env
        #   3. Keeps the sidecar running to renew tokens and hot-reload secrets
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-db.env: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{`{{- with secret "`}}{{ .Values.vault.secretPath }}{{`" -}}`}}
          export DB_HOST={{`{{ .Data.data.host }}`}}
          export DB_PORT={{`{{ .Data.data.port }}`}}
          export DB_USER={{`{{ .Data.data.username }}`}}
          export DB_PASSWORD={{`{{ .Data.data.password }}`}}
          export DB_NAME={{`{{ .Data.data.database }}`}}
          {{`{{- end -}}`}}
        vault.hashicorp.com/agent-inject-command-db.env: {{ .Values.vault.reloadCommand | quote }}
    spec:
      serviceAccountName: webapp-backend
      containers:
        - name: backend
          image: {{ include "webapp.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
          volumeMounts:
            - name: app-script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: app-script
          configMap:
            name: backend-script
---
# ── Backend Service ───────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-backend
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  selector:
    app: webapp-backend
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
