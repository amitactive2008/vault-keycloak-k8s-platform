# ServiceAccount used by the backend pod.
# Vault Agent authenticates to Vault using the token projected into this SA,
# then fetches secrets and writes them to /vault/secrets/db.env.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-backend
  namespace: {{ include "webapp.namespace" . }}
  labels:
    app: webapp-backend
    {{- include "webapp.labels" . | nindent 4 }}
