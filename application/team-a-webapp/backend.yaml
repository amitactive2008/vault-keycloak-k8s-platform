# Backend — Python HTTP server Deployment and Service
# ConfigMap (server.py) lives in backend-configmap.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-backend
  namespace: team-a
  labels:
    app: webapp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-backend
  template:
    metadata:
      labels:
        app: webapp-backend
      annotations:
        # ── Vault Agent sidecar injection ─────────────────────────────────────
        # The vault-agent-injector (deployed via Helm) intercepts this pod and
        # injects an init container + sidecar that:
        #   1. Authenticates to Vault using the webapp-backend SA token
        #      (Kubernetes auth method, role: team-a-webapp)
        #   2. Renders the template below into /vault/secrets/db.env
        #   3. Keeps the sidecar running to renew tokens and re-render on rotation
        #
        # Hot-reload flow (no pod restart needed):
        #   Vault secret changes
        #     → Vault Agent detects change via blocking query
        #     → re-renders /vault/secrets/db.env
        #     → runs agent-inject-command (kill -HUP 1)
        #     → backend SIGHUP handler logs the refresh
        #     → next API request reads fresh credentials from the updated file
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "team-a-webapp"
        vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/team-a/webapp/db"
        vault.hashicorp.com/agent-inject-template-db.env: |
          {{- with secret "secret/data/team-a/webapp/db" -}}
          export DB_HOST={{ .Data.data.host }}
          export DB_PORT={{ .Data.data.port }}
          export DB_USER={{ .Data.data.username }}
          export DB_PASSWORD={{ .Data.data.password }}
          export DB_NAME={{ .Data.data.database }}
          {{- end -}}
        # After each re-render Vault Agent sends SIGHUP to PID 1 (the backend).
        # In real apps with a connection pool, the SIGHUP handler should
        # reconnect using the new credentials.
        vault.hashicorp.com/agent-inject-command-db.env: "kill -HUP 1"
    spec:
      serviceAccountName: webapp-backend
      containers:
        - name: backend
          image: python:3.11-slim
          command: ["python3", "/app/server.py"]
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
          volumeMounts:
            - name: app-script
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: app-script
          configMap:
            name: backend-script
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-backend
  namespace: team-a
  labels:
    app: webapp-backend
spec:
  selector:
    app: webapp-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
