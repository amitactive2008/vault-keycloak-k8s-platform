# Service account for the webapp backend pod.
# Vault Agent authenticates to Vault using the token projected into this SA,
# then fetches secrets and injects them into the pod's /vault/secrets/ directory.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-backend
  namespace: team-a
  labels:
    app: webapp-backend
    app.kubernetes.io/managed-by: vault-setup
