# Frontend — nginx Deployment and Service
# ConfigMap (nginx.conf + index.html) lives in frontend-configmap.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-frontend
  namespace: team-a
  labels:
    app: webapp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-frontend
  template:
    metadata:
      labels:
        app: webapp-frontend
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: config
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-frontend
  namespace: team-a
  labels:
    app: webapp-frontend
spec:
  selector:
    app: webapp-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
