# HTTPRoutes for the monitoring stack
# Namespace: monitoring  |  Parent: native-gateway (default namespace)
# Covers: Prometheus, Grafana, Alertmanager, Blackbox Exporter
#
# Apply:
#   kubectl apply -f httproutes.yaml
#
# All routes follow the same pattern as 02-vault/vault-httproute.yaml:
#   - HTTPS route: *.kind.local → monitoring service (TLS terminated at gateway)
#   - HTTP redirect: 301 http:// → https://

# ── Prometheus ────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "prometheus.kind.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kube-prom-kube-prometheus-prometheus
      port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-http-redirect
  namespace: monitoring
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: http
  hostnames:
  - "prometheus.kind.local"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
