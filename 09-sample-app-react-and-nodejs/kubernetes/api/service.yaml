# API Service
# Name 'api-service' matches the proxy_pass in client/default.conf:
#   proxy_pass http://api-service:5000;
# This allows Nginx inside the client container to proxy /api/* to this service.
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: team-a
  labels:
    app: sample-react-app-api
spec:
  type: ClusterIP
  selector:
    app: sample-react-app-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
