# API Deployment — Node.js Express backend
#
# Vault Agent sidecar injects DB credentials and JWT secret from:
#   secret/data/team-a/sample-react-app/api
# into the file /vault/secrets/api.env inside the 'api' container.
#
# The api container sources /vault/secrets/api.env via CMD in server.js startup:
#   source /vault/secrets/api.env && node server.js
# (The entrypoint is overridden in this deployment to source the env file)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-react-app-api
  namespace: team-a
  labels:
    app: sample-react-app-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sample-react-app-api
      annotations:
        # ── Vault Agent Injection ────────────────────────────────────────────
        vault.hashicorp.com/agent-inject:          "true"
        vault.hashicorp.com/role:                  "team-a-sample-react-app"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-limits-cpu:      "100m"
        vault.hashicorp.com/agent-limits-mem:      "64Mi"
        vault.hashicorp.com/agent-requests-cpu:    "50m"
        vault.hashicorp.com/agent-requests-mem:    "32Mi"

        # Secret: secret/data/team-a/sample-react-app/api
        # Rendered as shell-sourceable env file: /vault/secrets/api.env
        vault.hashicorp.com/agent-inject-secret-api.env: "secret/data/team-a/sample-react-app/api"
        vault.hashicorp.com/agent-inject-template-api.env: |
          {{- with secret "secret/data/team-a/sample-react-app/api" -}}
          export DB_HOST="{{ .Data.data.DB_HOST }}"
          export DB_PORT="{{ .Data.data.DB_PORT }}"
          export DB_USER="{{ .Data.data.DB_USER }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          export DB_NAME="{{ .Data.data.DB_NAME }}"
          export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          export NODE_ENV="production"
          {{- end }}
    spec:
      serviceAccountName: sample-react-app-backend

      # Wait for MySQL to be ready before starting the API
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 3
              done
              echo "MySQL is ready ✓"

      containers:
        - name: api
          image: amitactive2008/sample-react-app-api:latest
          # Source Vault-injected env vars before starting the Node server
          command: ["/bin/sh", "-c"]
          args:
            - |
              source /vault/secrets/api.env && \
              node scripts/migrate.js && \
              node server.js
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
