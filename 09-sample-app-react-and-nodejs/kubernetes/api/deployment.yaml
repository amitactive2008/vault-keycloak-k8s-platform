# The Vault Agent injects runtime DB/JWT values. No application secrets are
# stored in this manifest or baked into the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-react-app-api
  namespace: team-a
  labels:
    app: sample-react-app-api
    team: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sample-react-app-api
        team: team-a
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/role: "team-a-sample-react-app"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "50m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
        vault.hashicorp.com/agent-inject-secret-api.env: "secret/data/team-a/sample-react-app/api"
        vault.hashicorp.com/agent-inject-template-api.env: |
          {{- with secret "secret/data/team-a/sample-react-app/api" -}}
          export DB_HOST="{{ .Data.data.DB_HOST }}"
          export DB_PORT="{{ .Data.data.DB_PORT }}"
          export DB_USER="{{ .Data.data.DB_USER }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          export DB_NAME="{{ .Data.data.DB_NAME }}"
          export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          export NODE_ENV="development"
          {{- end }}
    spec:
      serviceAccountName: sample-react-app-backend
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done
      containers:
        - name: api
          image: amitactive2008/sample-react-app-api:team-a-latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - source /vault/secrets/api.env && node scripts/migrate.js && exec node server.js
          ports:
            - name: http
              containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12

