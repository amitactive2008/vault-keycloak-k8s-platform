# MySQL StatefulSet for sample-react-app
# Credentials are bootstrapped from K8s Secret 'sample-react-app-mysql'
# created by vault-setup.sh. The API reads DB credentials from Vault
# (not directly from this Secret) via Vault Agent injection.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sample-react-app-mysql
  namespace: team-a
  labels:
    app: sample-react-app-mysql
spec:
  serviceName: sample-react-app-mysql
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-mysql
  template:
    metadata:
      labels:
        app: sample-react-app-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-react-app-mysql
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: sample-react-app-mysql
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: sample-react-app-mysql
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sample-react-app-mysql
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
