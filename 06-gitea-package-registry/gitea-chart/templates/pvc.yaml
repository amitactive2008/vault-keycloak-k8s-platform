apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  labels:
    {{- include "gitea.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
