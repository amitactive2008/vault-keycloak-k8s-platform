# MySQL Services — team-b
# 'mysql' ClusterIP matches DB_HOST=mysql stored in Vault (team-b/sample-react-app/api)
---
apiVersion: v1
kind: Service
metadata:
  name: sample-react-app-mysql
  namespace: team-b
  labels:
    app: sample-react-app-mysql
spec:
  clusterIP: None
  selector:
    app: sample-react-app-mysql
  ports:
    - port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: team-b
  labels:
    app: sample-react-app-mysql
spec:
  type: ClusterIP
  selector:
    app: sample-react-app-mysql
  ports:
    - port: 3306
      targetPort: 3306
