# Client Deployment — team-b namespace
# Nginx serves React SPA + proxies /api/* to api-service:5000
# Image: amitactive2008/sample-react-app-client:team-b-latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-react-app-client
  namespace: team-b
  labels:
    app: sample-react-app-client
    team: team-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-client
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: sample-react-app-client
    spec:
      containers:
        - name: client
          image: amitactive2008/sample-react-app-client:team-b-latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m",  memory: "64Mi"  }
            limits:   { cpu: "200m", memory: "128Mi" }
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
