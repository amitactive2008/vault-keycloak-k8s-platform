# ============================================================
# Default values for the ingress-nginx chart.
# Override any of these by passing -f ../values.yaml at install time.
# ============================================================

# Namespace to deploy into.
namespace: ingress-nginx

# ── Controller ────────────────────────────────────────────────
controller:
  # Number of controller pod replicas
  replicaCount: 1

  # Container image
  image:
    repository: registry.k8s.io/ingress-nginx/controller
    tag: "v1.15.1"
    # Set to empty string "" to disable digest pinning and use tag only.
    digest: "sha256:594ceea76b01c592858f803f9ff4d2cb40542cae2060410b2c95f75907d659e1"
    pullPolicy: IfNotPresent

  # Leader-election lease name
  electionId: ingress-nginx-leader

  # IngressClass name this controller handles
  ingressClass: nginx

  # Process Ingress objects that have no ingressClassName set
  watchIngressWithoutClass: true

  # Address advertised as the ingress status IP/hostname.
  # "localhost" is correct for kind (host ports on the local machine).
  publishStatusAddress: localhost

  # nginx ConfigMap key/value pairs injected into the controller ConfigMap.
  # Add any extra nginx global settings here.
  config:
    # Enables configuration-snippet and server-snippet annotations.
    # Default: "false" in nginx-ingress >= 1.9; set "true" only in trusted clusters.
    allowSnippetAnnotations: "true"
    # Limit nginx worker processes. Set to "1" under Podman/kind to avoid
    # pthread_create() EAGAIN failures caused by Podman's default pids-limit.
    workerProcesses: "1"

  # Controller Service settings
  service:
    # LoadBalancer: kind maps host ports 80/443 into the cluster.
    # NodePort: alternative for bare-metal or environments without LB support.
    type: LoadBalancer

  # Pod resource requests/limits
  resources:
    requests:
      cpu: 100m
      memory: 90Mi
    # limits: {}   # uncomment and set limits as needed

  # Node selector — pin the controller to the node that has host ports 80/443.
  # For kind clusters this must be the control-plane node.
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/hostname: vault-control-plane

  # Tolerate control-plane taints so the pod can run on the control-plane node.
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Equal
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Equal

  # Extra pod annotations (e.g. Prometheus scraping)
  podAnnotations: {}

  # Seconds to wait before SIGKILL after SIGTERM. 0 = immediate for kind.
  terminationGracePeriodSeconds: 0

# ── Admission Webhook ─────────────────────────────────────────
admissionWebhooks:
  # Set to false to disable the validating webhook entirely.
  enabled: true

  # What to do if the webhook is unreachable: Fail | Ignore
  failurePolicy: Fail

  # kube-webhook-certgen image (creates and patches the TLS secret)
  image:
    repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
    tag: "v1.6.9"
    digest: "sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd"
    pullPolicy: IfNotPresent

# ── IngressClass ──────────────────────────────────────────────
ingressClass:
  # Must match --ingress-class flag on the controller
  name: nginx
  # Controller identifier (do not change unless you know what you're doing)
  controller: k8s.io/ingress-nginx
