apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: {{ include "ingress-nginx.namespace" . }}
  labels:
    {{- include "ingress-nginx.controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicaCount }}
  minReadySeconds: 0
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "ingress-nginx.controller.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "ingress-nginx.controller.labels" . | nindent 8 }}
      {{- with .Values.controller.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: true
      containers:
      - name: controller
        image: {{ include "ingress-nginx.controller.image" . }}
        imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
        args:
        - /nginx-ingress-controller
        - --election-id={{ .Values.controller.electionId }}
        - --controller-class=k8s.io/ingress-nginx
        - --ingress-class={{ .Values.controller.ingressClass }}
        - --configmap=$(POD_NAMESPACE)/ingress-nginx-controller
        {{- if .Values.admissionWebhooks.enabled }}
        - --validating-webhook=:8443
        - --validating-webhook-certificate=/usr/local/certificates/cert
        - --validating-webhook-key=/usr/local/certificates/key
        {{- end }}
        - --watch-ingress-without-class={{ .Values.controller.watchIngressWithoutClass }}
        - --publish-status-address={{ .Values.controller.publishStatusAddress }}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: LD_PRELOAD
          value: /usr/local/lib/libmimalloc.so
        lifecycle:
          preStop:
            exec:
              command:
              - /wait-shutdown
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 10254
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: 80
          hostPort: 80
          name: http
          protocol: TCP
        - containerPort: 443
          hostPort: 443
          name: https
          protocol: TCP
        - containerPort: 8443
          name: webhook
          protocol: TCP
        resources:
          {{- toYaml .Values.controller.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 82
          runAsNonRoot: true
          runAsUser: 101
          seccompProfile:
            type: RuntimeDefault
        {{- if .Values.admissionWebhooks.enabled }}
        volumeMounts:
        - mountPath: /usr/local/certificates/
          name: webhook-cert
          readOnly: true
        {{- end }}
      dnsPolicy: ClusterFirst
      nodeSelector:
        {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
      serviceAccountName: ingress-nginx
      terminationGracePeriodSeconds: {{ .Values.controller.terminationGracePeriodSeconds }}
      tolerations:
        {{- toYaml .Values.controller.tolerations | nindent 8 }}
      {{- if .Values.admissionWebhooks.enabled }}
      volumes:
      - name: webhook-cert
        secret:
          secretName: ingress-nginx-admission
      {{- end }}
