# ── Main ingress controller Service ──────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: {{ include "ingress-nginx.namespace" . }}
  labels:
    {{- include "ingress-nginx.controller.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controller.service.type }}
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - appProtocol: http
    name: http
    port: 80
    protocol: TCP
    targetPort: http
  - appProtocol: https
    name: https
    port: 443
    protocol: TCP
    targetPort: https
  selector:
    {{- include "ingress-nginx.controller.selectorLabels" . | nindent 4 }}
---
{{- if .Values.admissionWebhooks.enabled }}
# ── Admission webhook Service (ClusterIP) ────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller-admission
  namespace: {{ include "ingress-nginx.namespace" . }}
  labels:
    {{- include "ingress-nginx.controller.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - appProtocol: https
    name: https-webhook
    port: 443
    targetPort: webhook
  selector:
    {{- include "ingress-nginx.controller.selectorLabels" . | nindent 4 }}
{{- end }}
