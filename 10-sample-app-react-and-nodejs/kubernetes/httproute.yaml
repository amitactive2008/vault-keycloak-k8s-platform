# HTTPRoutes for sample-react-app.kind.local
# Pattern: same as other services in this platform (02-vault, 03-keycloak, etc.)
#
# Traffic split:
#   /api/live   → api-service /live
#   /api/health → api-service /health
#   everything else → client service (React SPA and Nginx /api proxy)
---
# HTTPS route for sample-react-app.kind.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-react-app
  namespace: team-a
spec:
  parentRefs:
    - name: native-gateway
      namespace: default
      sectionName: https
  hostnames:
    - "sample-react-app.kind.local"
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/live
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /live
      backendRefs:
        - name: api-service
          port: 5000
    - matches:
        - path:
            type: Exact
            value: /api/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /health
      backendRefs:
        - name: api-service
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sample-react-app-client
          port: 80
---
# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sample-react-app-http-redirect
  namespace: team-a
spec:
  parentRefs:
    - name: native-gateway
      namespace: default
      sectionName: http
  hostnames:
    - "sample-react-app.kind.local"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
