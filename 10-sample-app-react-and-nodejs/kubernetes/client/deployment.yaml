apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-react-app-client
  namespace: team-a
  labels:
    app: sample-react-app-client
    team: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sample-react-app-client
        team: team-a
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: amitactive2008/sample-react-app-client:team-a-latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # The root Nginx master binds port 80, prepares its emptyDir
              # cache, then drops workers to UID/GID 101. These are the only
              # capabilities it retains.
              add: ["CHOWN", "NET_BIND_SERVICE", "SETGID", "SETUID"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
