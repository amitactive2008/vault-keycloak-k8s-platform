apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-react-app-client
  namespace: team-a
  labels:
    app: sample-react-app-client
    team: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-react-app-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: sample-react-app-client
        team: team-a
    spec:
      containers:
        - name: client
          image: amitactive2008/sample-react-app-client:team-a-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

