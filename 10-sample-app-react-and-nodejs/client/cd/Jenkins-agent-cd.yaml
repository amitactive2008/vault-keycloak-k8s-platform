apiVersion: v1
kind: Pod
spec:
  # All containers share the same workspace volume.
  # fsGroup 1000 ensures dirs created by jnlp (uid 1000) are group-writable,
  # so the kubectl container (also uid 0 below) can write durable task scripts.
  securityContext:
    fsGroup: 1000

  volumes:
    - name: workspace-volume
      emptyDir: {}

  containers:
    - name: jnlp
      image: jenkins/inbound-agent
      args:
        - "$(JENKINS_SECRET)"
        - "$(JENKINS_NAME)"
      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/agent

    - name: kubectl
      image: bitnami/kubectl:latest
      command: ["cat"]
      tty: true
      # Run as root so Jenkins durable-task sh scripts can be written to
      # workspace/@tmp dirs created by jnlp (uid 1000, mode 755).
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: workspace-volume
          mountPath: /home/jenkins/agent

        
    