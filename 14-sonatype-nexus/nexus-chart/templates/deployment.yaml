apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nexus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: nexus
      securityContext:
        fsGroup: 200
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: prepare-data
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /nexus-data/etc
              cp /config/nexus.properties /nexus-data/etc/nexus.properties
              JAVA_RUNTIME_HOME=$(java -XshowSettings:properties -version 2>&1 \
                | awk -F'= ' '/java.home =/{print $2; exit}')
              test -n "${JAVA_RUNTIME_HOME}"
              cp "${JAVA_RUNTIME_HOME}/lib/security/cacerts" /nexus-data/etc/nexus-truststore
              keytool -delete -alias kind-local-ca \
                -keystore /nexus-data/etc/nexus-truststore \
                -storepass changeit >/dev/null 2>&1 || true
              keytool -importcert -noprompt \
                -alias kind-local-ca \
                -file /kind-ca/tls.crt \
                -keystore /nexus-data/etc/nexus-truststore \
                -storepass changeit
              chown -R 200:200 /nexus-data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /nexus-data
            - name: properties
              mountPath: /config
              readOnly: true
            - name: kind-ca
              mountPath: /kind-ca
              readOnly: true
      containers:
        - name: nexus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: INSTALL4J_ADD_VM_PARAMS
              value: >-
                -Xms{{ .Values.jvm.minHeap }}
                -Xmx{{ .Values.jvm.maxHeap }}
                -XX:MaxDirectMemorySize={{ .Values.jvm.maxDirectMemory }}
                -Djava.util.prefs.userRoot=/nexus-data/javaprefs
                -Djavax.net.ssl.trustStore=/nexus-data/etc/nexus-truststore
                -Djavax.net.ssl.trustStorePassword=changeit
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /service/rest/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 200
            runAsGroup: 200
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /nexus-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexus-data
        - name: properties
          configMap:
            name: nexus-properties
        - name: kind-ca
          secret:
            secretName: nexus-kind-local-ca
