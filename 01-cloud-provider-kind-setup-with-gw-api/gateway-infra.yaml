apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: native-gateway
spec:
  gatewayClassName: envoy-gateway
  listeners:
  # HTTP listener — redirects to HTTPS
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # HTTPS listener — TLS terminated with wildcard *.kind.local cert
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: wildcard-kind-local-tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: All
---
# HTTP -> HTTPS redirect for all *.kind.local traffic
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
spec:
  parentRefs:
  - name: native-gateway
    sectionName: http
  hostnames:
  - "*.kind.local"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# HTTPS route for sample-web test app at sample.kind.local
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-traffic-route
spec:
  parentRefs:
  - name: native-gateway
    sectionName: https
  hostnames:
  - "sample.kind.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sample-web-service
      port: 80
