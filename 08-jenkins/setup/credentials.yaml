# Template for Jenkins runtime credentials.
# Copy this to jenkins/setup/credentials.yaml, fill in real values, then run:
#   kubectl apply -f jenkins/setup/credentials.yaml
#
# IMPORTANT: Do NOT commit credentials.yaml to Git.
#            Add it to .gitignore before creating it.
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-credentials
  namespace: jenkins
type: Opaque
stringData:
  # DockerHub account used by the pipeline to push images
  DOCKERHUB_USERNAME: "amitactive2008"
  DOCKERHUB_PASSWORD: "Welcome123"

  # NVD API key for OWASP Dependency-Check (free at https://nvd.nist.gov/developers/request-an-api-key)
  NVD_API_KEY: "ee3a7189-7277-49ab-8732-454488d74b45"

apiVersion: v1
kind: Secret
metadata:
  name: jenkins-credentials
  namespace: jenkins
type: Opaque
stringData:
  # DockerHub account used by the pipeline to push images
  DOCKERHUB_USERNAME: "amitactive2008"
  DOCKERHUB_PASSWORD: "Welcome123"

  # NVD API key for OWASP Dependency-Check
  NVD_API_KEY: "ee3a7189-7277-49ab-8732-454488d74b45"

  # The key name here will become the filename or identifier in Jenkins Configuration as Code (JCasC)
  EXTERNAL_KUBECONFIG: |
    apiVersion: v1
    clusters:
    - cluster:
        certificate-authority-data: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCg==...
        server: https://your-external-cluster-api:6443
      name: external-cluster
    contexts:
    - context:
        cluster: external-cluster
        user: external-admin
      name: external-context
    current-context: external-context
    kind: Config
    preferences: {}
    users:
    - name: external-admin
      user:
        token: secret-token-here