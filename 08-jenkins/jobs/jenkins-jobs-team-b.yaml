# Team B AI BankApp folder and pipeline jobs.
#
# Apply with:
#   cd 08-jenkins
#   ./reload-jobs.sh jobs/jenkins-jobs-team-b.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-jobs-team-b
  namespace: jenkins
  labels:
    jenkins-jenkins-config: "true"
    app.kubernetes.io/component: jenkins-controller
    app.kubernetes.io/instance: jenkins
    app.kubernetes.io/name: jenkins
data:
  jobs-team-b.yaml: |
    jobs:
      - script: |

          folder('team-b') {
            displayName('Team B')
            description('Team B pipelines — accessible by team-b and devops groups')
          }
          folder('team-b/ai-bankapp') {
            displayName('AI BankApp')
            description('Spring Boot, MySQL, and Ollama application deployed to the team-b namespace')
          }

          pipelineJob('team-b/ai-bankapp/ci') {
            displayName('CI')
            description('Gitleaks → Checkstyle → Semgrep → Maven package → image build → Trivy → Docker Hub image + OCI Helm chart → CD')
            logRotator { numToKeep(10) }
            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('https://github.com/amitactive2008/vault-keycloak-k8s-platform.git')
                    }
                    branches('*/v6-sonatype-valero')
                  }
                }
                scriptPath('11-ai-bankapp/AI-BankApp-DevOps/Jenkinsfile')
                lightweight(true)
              }
            }
          }

          pipelineJob('team-b/ai-bankapp/cd') {
            displayName('CD')
            description('Pulls an immutable AI BankApp OCI Helm chart from Docker Hub, deploys it to team-b, and runs smoke/DAST checks')
            parameters {
              stringParam('IMAGE_TAG', 'team-b-latest',
                          'Docker image tag produced by Team B CI')
              stringParam('CHART_VERSION', '0.1.1',
                          'OCI Helm chart version produced by Team B CI')
            }
            logRotator { numToKeep(20) }
            definition {
              cpsScm {
                scm {
                  git {
                    remote {
                      url('https://github.com/amitactive2008/vault-keycloak-k8s-platform.git')
                    }
                    branches('*/v6-sonatype-valero')
                  }
                }
                scriptPath('11-ai-bankapp/AI-BankApp-DevOps/cd/Jenkinsfile')
                lightweight(true)
              }
            }
          }
