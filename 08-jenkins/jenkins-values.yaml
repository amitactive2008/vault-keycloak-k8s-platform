# Jenkins Helm values — vault-keycloak-k8s-platform
# Chart   : jenkins/jenkins 5.9.40  |  Jenkins LTS 2.568.1
# Release : jenkins  |  Namespace: jenkins
#
# Key features:
#   • Keycloak OIDC authentication (oic-auth plugin)
#   • Role-based authorization (role-strategy plugin)
#     - devops  → global admin (all folders/jobs)
#     - team-a  → item-level access on team-a/.* only
#     - team-b  → item-level access on team-b/.* only
#   • Folder structure provisioned via JCasC + Job DSL:
#     /devops/{k8s, terraform-module, terragrunt, vault, keycloak}
#     /team-a/{ci, cd}/react-app
#     /team-b/{ci, cd}/react-app
#   • Kubernetes agent cloud (ephemeral pods)
#   • SonarQube + DockerHub credentials injected from K8s Secrets
#   • Gateway API HTTPRoute handles HTTPS (no nginx ingress needed)
#
# Install:
#   helm repo add jenkins https://charts.jenkins.io && helm repo update
#   helm install jenkins jenkins/jenkins \
#     --namespace jenkins --create-namespace \
#     --values 08-jenkins/jenkins-values.yaml \
#     --version 5.9.40
#
# Upgrade:
#   helm upgrade jenkins jenkins/jenkins \
#     --namespace jenkins \
#     --values 08-jenkins/jenkins-values.yaml \
#     --version <NEW_VERSION>

controller:
  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.568.1-lts"
    pullPolicy: "IfNotPresent"

  # Local admin — bypasses Keycloak (for emergency access + setup script)
  admin:
    username: "admin"
    password: "Admin@Jenkins2024!"

  # No executor on the controller — all builds run on Kubernetes agent pods
  numExecutors: 0

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # Skip setup wizard; suppress default CSP to allow SonarQube reports
  javaOpts: "-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP="

  # Jenkins external URL — MUST be set for OAuth redirect URIs to work correctly.
  # Keycloak will redirect to <jenkinsUrl>/securityRealm/finishLogin after auth.
  jenkinsUrl: "https://jenkins.kind.local"
  jenkinsUriPrefix: "/"

  # Credentials injected from Kubernetes Secrets (set by setup.sh)
  containerEnv:
    - name: DOCKERHUB_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-credentials
          key: DOCKERHUB_USERNAME
    - name: DOCKERHUB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: jenkins-credentials
          key: DOCKERHUB_PASSWORD
    - name: NVD_API_KEY
      valueFrom:
        secretKeyRef:
          name: jenkins-credentials
          key: NVD_API_KEY
    - name: SONARQUBE_TOKEN
      valueFrom:
        secretKeyRef:
          name: sonarqube-token
          key: token
          optional: true

  # ── Plugins ────────────────────────────────────────────────────────────────
  # oic-auth    : Keycloak OIDC authentication
  # role-strategy: folder-level RBAC
  # cloudbees-folder: nested folder support
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - configuration-as-code:latest
    - job-dsl:latest
    - docker-workflow:latest
    - credentials:latest
    - plain-credentials:latest
    - pipeline-stage-view:latest
    - github:latest
    - sonar:latest
    - dependency-check-jenkins-plugin:latest
    - ws-cleanup:latest
    - build-discarder:latest
    - pipeline-utility-steps:latest
    - ansicolor:latest
    - oic-auth:latest
    - role-strategy:latest
    - cloudbees-folder:latest
    - matrix-auth:latest

  # Disable built-in ingress — external access is via Gateway API HTTPRoute
  ingress:
    enabled: false

  # ── JCasC: Jenkins Configuration as Code ──────────────────────────────────
  # defaultConfig: false → we own the full security + location config
  JCasC:
    defaultConfig: false
    configScripts:

      # ── 1. Jenkins core: location + authorization ─────────────────────────────
      # NOTE: securityRealm (OIDC) is intentionally omitted from JCasC — it is
      # configured post-install by setup.sh via the Jenkins API/CLI because the
      # oic-auth plugin's JCasC schema varies significantly between plugin versions.
      # Jenkins starts with local auth (admin/admin); OIDC is applied by setup.sh.
      security: |
        jenkins:
          # ── Authentication: Keycloak OIDC (oic-auth v4.x) ─────────────────
          # oic-auth v4.x JCasC schema (from /configuration-as-code/schema):
          #   OicSecurityRealm: clientId, clientSecret, serverConfiguration,
          #     userNameField, fullNameFieldName, emailFieldName, groupsFieldName,
          #     disableSslVerification, logoutFromOpenidProvider, postLogoutRedirectUrl
          #   OicServerWellKnownConfiguration (nested in serverConfiguration.wellKnown):
          #     wellKnownOpenIDConfigurationUrl, scopesOverride
          securityRealm:
            oic:
              clientId: "jenkins"
              clientSecret: "Jenkins@Keycloak2024!"
              serverConfiguration:
                wellKnown:
                  wellKnownOpenIDConfigurationUrl: "https://keycloak.kind.local/realms/kind/.well-known/openid-configuration"
                  scopesOverride: "openid email profile"
              userNameField: "preferred_username"
              fullNameFieldName: "name"
              emailFieldName: "email"
              groupsFieldName: "groups"
              disableSslVerification: true
              logoutFromOpenidProvider: true
              postLogoutRedirectUrl: "https://jenkins.kind.local"
              # Allow Jenkins API tokens to work without an active OIC browser session.
              # Required so that automation (scripts, API calls) can authenticate
              # using Jenkins-generated API tokens even when OIC is the security realm.
              allowTokenAccessWithoutOicSession: true
          authorizationStrategy:
            roleBased:
              roles:
                global:
                  - name: "devops-admin"
                    description: "Full Jenkins administrator — devops group + local admin"
                    permissions:
                      - "Overall/Administer"
                    entries:
                      - group: "devops"
                      - user: "admin"
                  - name: "authenticated-read"
                    description: "Base role — all authenticated users can log in"
                    permissions:
                      - "Overall/Read"
                    entries:
                      - group: "authenticated"
                  - name: "anonymous-probe"
                    description: "Allow /login page for health probes and unauthenticated access"
                    permissions:
                      - "Overall/Read"
                    entries:
                      - user: "anonymous"
                items:
                  - name: "team-a-developer"
                    description: "Team A access — all jobs under team-a/ folder"
                    pattern: "team-a.*"
                    permissions:
                      - "Job/Read"
                      - "Job/Build"
                      - "Job/Cancel"
                      - "Job/Workspace"
                      - "Run/Replay"
                      - "Run/Update"
                      - "View/Read"
                    entries:
                      - group: "team-a"
                  - name: "team-b-developer"
                    description: "Team B access — all jobs under team-b/ folder"
                    pattern: "team-b.*"
                    permissions:
                      - "Job/Read"
                      - "Job/Build"
                      - "Job/Cancel"
                      - "Job/Workspace"
                      - "Run/Replay"
                      - "Run/Update"
                      - "View/Read"
                    entries:
                      - group: "team-b"
                      - user: "anonymous"
        security:
          gitHostKeyVerificationConfiguration:
            sshHostKeyVerificationStrategy: "noHostKeyVerificationStrategy"
        unclassified:
          location:
            url: "https://jenkins.kind.local/"
            adminAddress: ""

      # ── 2. Kubernetes cloud for agent pods ──────────────────────────────────
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: ""
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
                jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
                connectTimeout: 30
                readTimeout: 30
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                retentionTimeout: 5
                templates: []

      # ── 3. Tool integrations (SonarQube + credentials) ──────────────────────
      integrations: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      id: "dockerhub"
                      description: "DockerHub — amitactive2008"
                      username: "${DOCKERHUB_USERNAME}"
                      password: "${DOCKERHUB_PASSWORD}"
                      scope: GLOBAL
                  - string:
                      id: "NVD_API_KEY"
                      description: "NVD API Key for OWASP Dependency-Check"
                      secret: "${NVD_API_KEY}"
                      scope: GLOBAL
                  - string:
                      id: "sonarqube-token"
                      description: "SonarQube global analysis token"
                      secret: "${SONARQUBE_TOKEN}"
                      scope: GLOBAL
        unclassified:
          sonarGlobalConfiguration:
            buildWrapperEnabled: true
            installations:
              - name: "mysonarqube"
                serverUrl: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
                credentialsId: "sonarqube-token"

      # ── 4. Folder structure + pipeline jobs via Job DSL ─────────────────────
      # Provisions all folders and stub pipeline jobs.
      # Jobs reference the 09-sample-app-react-and-nodejs/ Jenkinsfiles.
      # devops items: restrict by admin permission (devops group is global admin)
      # team-a/team-b items: provisioned here; RBAC controls who can access them.
      jobs: |
        jobs:
          - script: |

              // ── DevOps folder tree ───────────────────────────────────────
              folder('devops') {
                displayName('DevOps')
                description('DevOps team pipelines — Full access for devops group only')
              }
              folder('devops/k8s') {
                displayName('Kubernetes')
                description('Kubernetes cluster management and deployment pipelines')
              }
              folder('devops/terraform-module') {
                displayName('Terraform Modules')
                description('Terraform module CI/CD pipelines')
              }
              folder('devops/terragrunt') {
                displayName('Terragrunt')
                description('Terragrunt deployment pipelines')
              }
              folder('devops/vault') {
                displayName('Vault')
                description('HashiCorp Vault configuration and policy pipelines')
              }
              folder('devops/keycloak') {
                displayName('Keycloak')
                description('Keycloak realm and client management pipelines')
              }

              // ── Team A folder tree ───────────────────────────────────────
              folder('team-a') {
                displayName('Team A')
                description('Team A pipelines — accessible by team-a and devops groups')
              }
              folder('team-a/ci') {
                displayName('CI')
                description('Team A Continuous Integration pipelines')
              }
              folder('team-a/cd') {
                displayName('CD')
                description('Team A Continuous Deployment pipelines')
              }

              // team-a/ci/react-app: React frontend CI (gitleaks, SCA, SAST, docker image)
              pipelineJob('team-a/ci/react-app') {
                displayName('React App CI')
                description('''CI pipeline for team-a React frontend.
                  Stages: Checkout → Compile → Gitleaks → SCA → SAST → Quality Gate → Docker → Trivy
                  Agent: jenkins/Jenkins-agent.yaml (nodejs, sonar, trivy, docker-cli containers)''')
                logRotator { numToKeep(10) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git')
                        }
                        branches('*/main', '*/dev')
                      }
                    }
                    scriptPath('client/Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

              // team-a/cd/react-app: React frontend CD (deploy to Kind cluster)
              pipelineJob('team-a/cd/react-app') {
                displayName('React App CD')
                description('''CD pipeline for team-a React frontend.
                  Deploys the client image built by team-a/ci/react-app to the Kind cluster.
                  Agent: jenkins/Jenkins-agent-cd.yaml (kubectl container)''')
                parameters {
                  stringParam('CLIENT_IMAGE_TAG', 'latest', 'Client Docker image tag from CI build')
                  stringParam('API_IMAGE_TAG',    'latest', 'API Docker image tag (if co-deploying)')
                }
                logRotator { numToKeep(20) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git')
                        }
                        branches('*/main')
                      }
                    }
                    scriptPath('jenkins/Jenkinsfile-cd-local')
                    lightweight(true)
                  }
                }
              }

              // ── Team B folder tree ───────────────────────────────────────
              folder('team-b') {
                displayName('Team B')
                description('Team B pipelines — accessible by team-b and devops groups')
              }
              folder('team-b/ci') {
                displayName('CI')
                description('Team B Continuous Integration pipelines')
              }
              folder('team-b/cd') {
                displayName('CD')
                description('Team B Continuous Deployment pipelines')
              }

              // team-b/ci/react-app
              pipelineJob('team-b/ci/react-app') {
                displayName('React App CI')
                description('''CI pipeline for team-b React frontend.
                  Stages: Checkout → Compile → Gitleaks → SCA → SAST → Quality Gate → Docker → Trivy''')
                logRotator { numToKeep(10) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git')
                        }
                        branches('*/main', '*/dev')
                      }
                    }
                    scriptPath('client/Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

              // team-b/cd/react-app
              pipelineJob('team-b/cd/react-app') {
                displayName('React App CD')
                description('CD pipeline for team-b React frontend deployment')
                parameters {
                  stringParam('CLIENT_IMAGE_TAG', 'latest', 'Client Docker image tag')
                  stringParam('API_IMAGE_TAG',    'latest', 'API Docker image tag')
                }
                logRotator { numToKeep(20) }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git')
                        }
                         branches('*/main')
                       }
                     }
                     scriptPath('jenkins/Jenkinsfile-cd-local')
                     lightweight(true)
                   }
                 }
               }

               // ── team-a: sample-react-app subfolder tree ──────────────────
               // Full-stack React + Node.js app with Vault secret injection.
               // Vault path: secret/data/team-a/sample-react-app/{api,client}
               // Namespace:  team-a
               folder('team-a/sample-react-app') {
                 displayName('Sample React App')
                 description('Full-stack React (client) + Node.js (api) with MySQL. Secrets from Vault: team-a/sample-react-app/*')
               }
               folder('team-a/sample-react-app/api') {
                 displayName('API (Node.js)')
                 description('Node.js Express REST API with Sequelize/MySQL')
               }
               folder('team-a/sample-react-app/client') {
                 displayName('Client (React)')
                 description('React 19 SPA served by Nginx')
               }

               // team-a/sample-react-app/api/ci
               pipelineJob('team-a/sample-react-app/api/ci') {
                 displayName('CI')
                 description('API CI: Checkout→Install→Gitleaks→SCA→SAST→QGate→Docker→Trivy→TriggerCD. Image: amitactive2008/sample-react-app-api:<build>')
                 logRotator { numToKeep(10) }
                 definition {
                   cpsScm {
                     scm {
                       git {
                         remote { url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git') }
                         branches('*/main', '*/dev')
                       }
                     }
                     scriptPath('09-sample-app-react-and-nodejs/api/Jenkinsfile')
                     lightweight(true)
                   }
                 }
               }

               // team-a/sample-react-app/api/cd
               pipelineJob('team-a/sample-react-app/api/cd') {
                 displayName('CD')
                 description('API CD: deploys amitactive2008/sample-react-app-api:<IMAGE_TAG> to team-a namespace. Triggered by CI or manual run.')
                 parameters {
                   stringParam('IMAGE_TAG', 'latest', 'Docker image tag to deploy (CI build number)')
                 }
                 logRotator { numToKeep(20) }
                 definition {
                   cpsScm {
                     scm {
                       git {
                         remote { url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git') }
                         branches('*/main')
                       }
                     }
                     scriptPath('09-sample-app-react-and-nodejs/api/Jenkinsfile-cd')
                     lightweight(true)
                   }
                 }
               }

               // team-a/sample-react-app/client/ci
               pipelineJob('team-a/sample-react-app/client/ci') {
                 displayName('CI')
                 description('Client CI: Checkout→Install→Gitleaks→Tests→SCA→SAST→QGate→Docker→Trivy→TriggerCD. Image: amitactive2008/sample-react-app-client:<build>')
                 logRotator { numToKeep(10) }
                 definition {
                   cpsScm {
                     scm {
                       git {
                         remote { url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git') }
                         branches('*/main', '*/dev')
                       }
                     }
                     scriptPath('09-sample-app-react-and-nodejs/client/Jenkinsfile')
                     lightweight(true)
                   }
                 }
               }

               // team-a/sample-react-app/client/cd
               pipelineJob('team-a/sample-react-app/client/cd') {
                 displayName('CD')
                 description('Client CD: deploys amitactive2008/sample-react-app-client:<IMAGE_TAG> to team-a namespace. Triggered by CI or manual run.')
                 parameters {
                   stringParam('IMAGE_TAG', 'latest', 'Docker image tag to deploy (CI build number)')
                 }
                 logRotator { numToKeep(20) }
                 definition {
                   cpsScm {
                     scm {
                       git {
                         remote { url('https://github.com/amitactive2008/DevSecOps-Mega-Project.git') }
                         branches('*/main')
                       }
                     }
                      scriptPath('09-sample-app-react-and-nodejs/client/Jenkinsfile-cd')
                      lightweight(true)
                    }
                  }
                }

               // ── team-b: sample-react-app subfolder tree ──────────────────
               // Same source code as team-a but deployed to team-b namespace.
               // Source: https://github.com/amitactive2008/DevSecOps-Mega-Project.git
               // Vault:  secret/data/team-b/sample-react-app/{api,client}
               // Images: amitactive2008/sample-react-app-{api,client}:team-b-<build>
               // URL:    https://sample-react-app-team-b.kind.local
               folder('team-b/sample-react-app') {
                 displayName('Sample React App')
                 description('Same stack as team-a but for team-b namespace. Source: amitactive2008/DevSecOps-Mega-Project. Vault: team-b/sample-react-app/*')
               }
               folder('team-b/sample-react-app/api') {
                 displayName('API (Node.js)')
                 description('Node.js Express API — team-b deployment')
               }
               folder('team-b/sample-react-app/client') {
                 displayName('Client (React)')
                 description('React SPA via Nginx — team-b deployment')
               }


               // ── team-b: sample-react-app subfolder tree ──────────────────
               // Source: amitactive2008/DevSecOps-Mega-Project (GitHub, branch: dev)
               // Vault:  secret/data/team-b/sample-react-app/{api,client}
               // Images: amitactive2008/sample-react-app-{api,client}:team-b-<build>
               // URL:    https://sample-react-app-team-b.kind.local
               // Fix:    All 4 jobs use cps (inline script) so Jenkins never looks for
               //         Jenkinsfile inside the external GitHub repo.
               folder('team-b/sample-react-app') {
                 displayName('Sample React App')
                 description('Same stack as team-a; deployed to team-b ns. Source: amitactive2008/DevSecOps-Mega-Project. Vault: team-b/sample-react-app/*')
               }
               folder('team-b/sample-react-app/api') {
                 displayName('API (Node.js)')
                 description('Node.js Express API — team-b namespace')
               }
               folder('team-b/sample-react-app/client') {
                 displayName('Client (React)')
                 description('React SPA via Nginx — team-b namespace')
               }

               // ── api/ci ──────────────────────────────────────────────────
               pipelineJob('team-b/sample-react-app/api/ci') {
                 displayName('CI')
                 description('API CI: checkout GitHub dev branch, build multi-platform Docker image team-b-<BUILD>, push to DockerHub, trigger CD.')
                 logRotator { numToKeep(10) }
                 definition {
                   cps {
                     sandbox(true)
                     script('''
                     pipeline {
                       agent {
                         kubernetes {
                           defaultContainer 'docker-cli'
                           yaml """
                           apiVersion: v1
                           kind: Pod
                           spec:
                             volumes:
                             - name: ws
                               emptyDir: {}
                             containers:
                             - name: jnlp
                               image: jenkins/inbound-agent
                               volumeMounts:
                               - name: ws
                                 mountPath: /home/jenkins/agent
                             - name: docker-cli
                               image: docker:27-cli
                               command: ["cat"]
                               tty: true
                               volumeMounts:
                               - name: ws
                                 mountPath: /home/jenkins/agent
                           """
                         }
                       }
                       environment {
                         REGISTRY   = "amitactive2008"
                         IMAGE_NAME = "sample-react-app-api"
                         TEAM       = "team-b"
                         IMAGE_TAG  = "team-b-${BUILD_NUMBER}"
                         GIT_REPO   = "https://github.com/amitactive2008/DevSecOps-Mega-Project.git"
                         GIT_BRANCH = "dev"
                       }
                       options {
                         disableConcurrentBuilds()
                         buildDiscarder(logRotator(numToKeepStr: "10"))
                         timeout(time: 30, unit: "MINUTES")
                       }
                       stages {
                         stage("Stage 1: Checkout") {
                           steps {
                             git branch: "${GIT_BRANCH}", url: "${GIT_REPO}"
                             sh "git log --oneline -3"
                           }
                         }
                         stage("Stage 2: Docker Build & Push") {
                           steps {
                             dir("api") {
                               withCredentials([usernamePassword(
                                   credentialsId: "dockerhub",
                                   usernameVariable: "DOCKER_USER",
                                   passwordVariable: "DOCKER_PASS")]) {
                                 sh """
                                   echo "\$DOCKER_PASS" | docker login -u "\$DOCKER_USER" --password-stdin
                                   docker buildx create --name tb-api-bd \\\\
                                     --driver remote \\\\
                                     tcp://buildkitd.jenkins.svc.cluster.local:1234 \\\\
                                     --use --bootstrap 2>/dev/null || docker buildx use tb-api-bd
                                   docker buildx build \\\\
                                     --platform linux/amd64,linux/arm64 \\\\
                                     --push \\\\
                                     -t ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} \\\\
                                     -t ${REGISTRY}/${IMAGE_NAME}:${TEAM}-latest \\\\
                                     .
                                   docker buildx rm tb-api-bd || true
                                 """
                               }
                             }
                           }
                         }
                         stage("Stage 3: Trigger CD") {
                           steps {
                             build job: "team-b/sample-react-app/api/cd",
                                   parameters: [string(name: "IMAGE_TAG", value: "${IMAGE_TAG}")],
                                   wait: false
                           }
                         }
                       }
                       post {
                         success { echo "✓ team-b API CI: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" }
                         failure { echo "✗ team-b API CI failed" }
                       }
                     }
                     '''.stripIndent())
                   }
                 }
               }

               // ── api/cd ──────────────────────────────────────────────────
               pipelineJob('team-b/sample-react-app/api/cd') {
                 displayName('CD')
                 description('API CD: update team-b/sample-react-app-api image tag, rollout, smoke test.')
                 parameters {
                   stringParam('IMAGE_TAG', 'team-b-latest', 'Image tag from CI (e.g. team-b-42)')
                 }
                 logRotator { numToKeep(20) }
                 definition {
                   cps {
                     sandbox(true)
                     script('''
                     pipeline {
                       agent {
                         kubernetes {
                           defaultContainer 'kubectl'
                           yaml """
                           apiVersion: v1
                           kind: Pod
                           spec:
                             serviceAccountName: jenkins
                             containers:
                             - name: jnlp
                               image: jenkins/inbound-agent
                             - name: kubectl
                               image: bitnami/kubectl:latest
                               command: ["cat"]
                               tty: true
                               securityContext:
                                 runAsUser: 0
                                 runAsNonRoot: false
                           """
                         }
                       }
                       parameters {
                         string(name: "IMAGE_TAG", defaultValue: "team-b-latest", description: "Image tag from CI")
                       }
                       environment {
                         REGISTRY   = "amitactive2008"
                         IMAGE_NAME = "sample-react-app-api"
                         NAMESPACE  = "team-b"
                         DEPLOY     = "sample-react-app-api"
                       }
                       options {
                         disableConcurrentBuilds()
                         buildDiscarder(logRotator(numToKeepStr: "20"))
                         timeout(time: 15, unit: "MINUTES")
                       }
                       stages {
                         stage("Stage 1: Update Image") {
                           steps {
                             sh """
                               kubectl set image deployment/${DEPLOY} \\\\
                                 api=${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG} \\\\
                                 -n ${NAMESPACE}
                               echo "Updated to ${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG}"
                             """
                           }
                         }
                         stage("Stage 2: Wait for Rollout") {
                           steps {
                             sh """
                               kubectl rollout status deployment/${DEPLOY} -n ${NAMESPACE} --timeout=5m
                               kubectl get pods -n ${NAMESPACE} -l app=sample-react-app-api
                             """
                           }
                         }
                         stage("Stage 3: Smoke Test") {
                           steps {
                             sh """
                               POD=\$(kubectl get pod -l app=sample-react-app-api -n ${NAMESPACE} \\\\
                                 -o jsonpath="{.items[0].metadata.name}" 2>/dev/null || echo "")
                               if [ -n "\$POD" ]; then
                                 kubectl exec \$POD -n ${NAMESPACE} -c api -- wget -qO- http://localhost:5000/live && echo " ✓ /live"
                                 kubectl exec \$POD -n ${NAMESPACE} -c api -- wget -qO- http://localhost:5000/health && echo " ✓ /health"
                               fi
                             """
                           }
                         }
                       }
                       post {
                         success { echo "✓ team-b API deployed: ${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG}" }
                         failure { sh "kubectl get pods -n ${NAMESPACE} || true" }
                       }
                     }
                     '''.stripIndent())
                   }
                 }
               }

               // ── client/ci ────────────────────────────────────────────────
               pipelineJob('team-b/sample-react-app/client/ci') {
                 displayName('CI')
                 description('Client CI: checkout GitHub dev branch, run npm test, build multi-platform Docker image team-b-<BUILD>, push to DockerHub, trigger CD.')
                 logRotator { numToKeep(10) }
                 definition {
                   cps {
                     sandbox(true)
                     script('''
                     pipeline {
                       agent {
                         kubernetes {
                           defaultContainer 'nodejs'
                           yaml """
                           apiVersion: v1
                           kind: Pod
                           spec:
                             volumes:
                             - name: ws
                               emptyDir: {}
                             containers:
                             - name: jnlp
                               image: jenkins/inbound-agent
                               volumeMounts:
                               - name: ws
                                 mountPath: /home/jenkins/agent
                             - name: nodejs
                               image: node:22-alpine
                               command: ["cat"]
                               tty: true
                               volumeMounts:
                               - name: ws
                                 mountPath: /home/jenkins/agent
                             - name: docker-cli
                               image: docker:27-cli
                               command: ["cat"]
                               tty: true
                               volumeMounts:
                               - name: ws
                                 mountPath: /home/jenkins/agent
                           """
                         }
                       }
                       environment {
                         REGISTRY   = "amitactive2008"
                         IMAGE_NAME = "sample-react-app-client"
                         TEAM       = "team-b"
                         IMAGE_TAG  = "team-b-${BUILD_NUMBER}"
                         GIT_REPO   = "https://github.com/amitactive2008/DevSecOps-Mega-Project.git"
                         GIT_BRANCH = "dev"
                       }
                       options {
                         disableConcurrentBuilds()
                         buildDiscarder(logRotator(numToKeepStr: "10"))
                         timeout(time: 30, unit: "MINUTES")
                       }
                       stages {
                         stage("Stage 1: Checkout") {
                           steps {
                             git branch: "${GIT_BRANCH}", url: "${GIT_REPO}"
                             sh "git log --oneline -3"
                           }
                         }
                         stage("Stage 2: Unit Tests") {
                           steps {
                             dir("client") {
                               sh "npm ci --prefer-offline"
                               sh "npm test -- --coverage --watchAll=false --ci"
                             }
                           }
                         }
                         stage("Stage 3: Docker Build & Push") {
                           steps {
                             container("docker-cli") {
                               dir("client") {
                                 withCredentials([usernamePassword(
                                     credentialsId: "dockerhub",
                                     usernameVariable: "DOCKER_USER",
                                     passwordVariable: "DOCKER_PASS")]) {
                                   sh """
                                     echo "\$DOCKER_PASS" | docker login -u "\$DOCKER_USER" --password-stdin
                                     docker buildx create --name tb-cli-bd \\\\
                                       --driver remote \\\\
                                       tcp://buildkitd.jenkins.svc.cluster.local:1234 \\\\
                                       --use --bootstrap 2>/dev/null || docker buildx use tb-cli-bd
                                     docker buildx build \\\\
                                       --platform linux/amd64,linux/arm64 \\\\
                                       --push \\\\
                                       -t ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} \\\\
                                       -t ${REGISTRY}/${IMAGE_NAME}:${TEAM}-latest \\\\
                                       .
                                     docker buildx rm tb-cli-bd || true
                                   """
                                 }
                               }
                             }
                           }
                         }
                         stage("Stage 4: Trigger CD") {
                           steps {
                             build job: "team-b/sample-react-app/client/cd",
                                   parameters: [string(name: "IMAGE_TAG", value: "${IMAGE_TAG}")],
                                   wait: false
                           }
                         }
                       }
                       post {
                         success { echo "✓ team-b Client CI: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}" }
                         failure { echo "✗ team-b Client CI failed" }
                       }
                     }
                     '''.stripIndent())
                   }
                 }
               }

               // ── client/cd ────────────────────────────────────────────────
               pipelineJob('team-b/sample-react-app/client/cd') {
                 displayName('CD')
                 description('Client CD: update team-b/sample-react-app-client image, rollout, smoke test.')
                 parameters {
                   stringParam('IMAGE_TAG', 'team-b-latest', 'Image tag from CI')
                 }
                 logRotator { numToKeep(20) }
                 definition {
                   cps {
                     sandbox(true)
                     script('''
                     pipeline {
                       agent {
                         kubernetes {
                           defaultContainer 'kubectl'
                           yaml """
                           apiVersion: v1
                           kind: Pod
                           spec:
                             serviceAccountName: jenkins
                             containers:
                             - name: jnlp
                               image: jenkins/inbound-agent
                             - name: kubectl
                               image: bitnami/kubectl:latest
                               command: ["cat"]
                               tty: true
                               securityContext:
                                 runAsUser: 0
                                 runAsNonRoot: false
                           """
                         }
                       }
                       parameters {
                         string(name: "IMAGE_TAG", defaultValue: "team-b-latest", description: "Image tag from CI")
                       }
                       environment {
                         REGISTRY   = "amitactive2008"
                         IMAGE_NAME = "sample-react-app-client"
                         NAMESPACE  = "team-b"
                         DEPLOY     = "sample-react-app-client"
                       }
                       options {
                         disableConcurrentBuilds()
                         buildDiscarder(logRotator(numToKeepStr: "20"))
                         timeout(time: 10, unit: "MINUTES")
                       }
                       stages {
                         stage("Stage 1: Update Image") {
                           steps {
                             sh """
                               kubectl set image deployment/${DEPLOY} \\\\
                                 client=${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG} \\\\
                                 -n ${NAMESPACE}
                               echo "Updated to ${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG}"
                             """
                           }
                         }
                         stage("Stage 2: Wait for Rollout") {
                           steps {
                             sh """
                               kubectl rollout status deployment/${DEPLOY} -n ${NAMESPACE} --timeout=5m
                               kubectl get pods -n ${NAMESPACE} -l app=sample-react-app-client
                             """
                           }
                         }
                         stage("Stage 3: Smoke Test") {
                           steps {
                             sh """
                               POD=\$(kubectl get pod -l app=sample-react-app-client -n ${NAMESPACE} \\\\
                                 -o jsonpath="{.items[0].metadata.name}" 2>/dev/null || echo "")
                               [ -n "\$POD" ] && \\\\
                                 kubectl exec \$POD -n ${NAMESPACE} -c client -- \\\\
                                   wget -qO- http://localhost:80/ | grep -c "DevOps" && echo " ✓" || true
                             """
                           }
                         }
                       }
                       post {
                         success { echo "✓ team-b Client deployed: ${REGISTRY}/${IMAGE_NAME}:${params.IMAGE_TAG} → https://sample-react-app-team-b.kind.local" }
                         failure { sh "kubectl get pods -n ${NAMESPACE} || true" }
                       }
                     }
                     '''.stripIndent())
                   }
                  }
                }

               // ── Auto-trigger team-b CI builds after JCasC seed runs ──────
               // This queues the team-b CI jobs immediately when Jenkins applies
               // the JCasC configuration, bypassing HTTP auth requirements.
               // Remove these queue() calls after the initial successful run.
               queue('team-b/sample-react-app/api/ci')
               queue('team-b/sample-react-app/client/ci')

# ── Persistent storage ────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: "standard"
  size: "10Gi"

# ── Service Account + RBAC ────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: "jenkins"

rbac:
  create: true
  readSecrets: true

# ── Agent pods ────────────────────────────────────────────────────────────────
agent:
  enabled: true
  namespace: "jenkins"
  # Default agent image — overridden per-job via yamlFile
  image:
    repository: "jenkins/inbound-agent"
    tag: "latest"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
