# HTTPRoutes for Jenkins and SonarQube
# Namespace: jenkins / sonarqube  |  Parent: native-gateway (default namespace)
# Pattern: same as 02-vault/vault-httproute.yaml
#
# Apply:
#   kubectl apply -f 08-jenkins/httproutes.yaml

# ── Jenkins ───────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins
  namespace: jenkins
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "jenkins.kind.local"
  - "jenkins-resources.kind.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jenkins
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jenkins-http-redirect
  namespace: jenkins
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: http
  hostnames:
  - "jenkins.kind.local"
  - "jenkins-resources.kind.local"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# ── SonarQube ─────────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "sonarqube.kind.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sonarqube-sonarqube
      port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube-http-redirect
  namespace: sonarqube
spec:
  parentRefs:
  - name: native-gateway
    namespace: default
    sectionName: http
  hostnames:
  - "sonarqube.kind.local"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
