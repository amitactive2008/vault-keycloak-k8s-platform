apiVersion: v1
clusters:
    - cluster:
        certificate-authority-data: 
        server: https://127.0.0.1:6443
      name: kind-vault
contexts:
    - context:
        cluster: kind-vault
        namespace: default
        user: devops-oidc
      name: devops
    - context:
        cluster: kind-vault
        namespace: team-a
        user: team-a-oidc
      name: team-a
    - context:
        cluster: kind-vault
        namespace: team-b
        user: team-b-oidc
      name: team-b
current-context: team-a
kind: Config
users:
    - name: devops-oidc
      user:
        exec:
            apiVersion: client.authentication.k8s.io/v1beta1
            args:
                - oidc-login
                - get-token
                - --oidc-issuer-url=https://keycloak.local/realms/kind
                - --oidc-client-id=kubernetes
                - --oidc-auth-request-extra-params=prompt=login
                - --certificate-authority=/Users/amit.kumar1/Desktop/study/vault-keycloak-k8s-platform/keycloak/k8s-oidc/keycloak-local-ca.crt
            command: kubectl
            env:
                - name: GODEBUG
                  value: netdns=go
            interactiveMode: IfAvailable
            provideClusterInfo: false
    - name: team-a-oidc
      user:
        exec:
            apiVersion: client.authentication.k8s.io/v1beta1
            args:
                - oidc-login
                - get-token
                - --oidc-issuer-url=https://keycloak.local/realms/kind
                - --oidc-client-id=kubernetes
                - --oidc-auth-request-extra-params=prompt=login
                - --certificate-authority=/Users/amit.kumar1/Desktop/study/vault-keycloak-k8s-platform/keycloak/k8s-oidc/keycloak-local-ca.crt
            command: kubectl
            env:
                - name: GODEBUG
                  value: netdns=go
            interactiveMode: IfAvailable
            provideClusterInfo: false
    - name: team-b-oidc
      user:
        exec:
            apiVersion: client.authentication.k8s.io/v1beta1
            args:
                - oidc-login
                - get-token
                - --oidc-issuer-url=https://keycloak.local/realms/kind
                - --oidc-client-id=kubernetes
                - --oidc-auth-request-extra-params=prompt=login
                - --certificate-authority=/Users/amit.kumar1/Desktop/study/vault-keycloak-k8s-platform/keycloak/k8s-oidc/keycloak-local-ca.crt
            command: kubectl
            env:
                - name: GODEBUG
                  value: netdns=go
            interactiveMode: IfAvailable
            provideClusterInfo: false
